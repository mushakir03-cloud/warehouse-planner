name: Build deploy bundle for NameHero

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js app
        run: npm run build

      - name: Copy public/static assets into standalone output
        run: node scripts/copy-standalone-assets.js

      - name: Assemble deploy bundle
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle
          cp -r .next/standalone/. deploy-bundle/
          # standalone output already includes its own correct server.js
          # and package.json — do not overwrite them.
          echo "--- before removal ---"
          ls -la deploy-bundle/node_modules/@next/ || echo "no @next dir"
          # SWC's native compiler binaries are only needed at build time,
          # not at runtime, and exceed GitHub's 100MB file size limit.
          rm -rfv deploy-bundle/node_modules/@next/swc-linux-x64-gnu
          rm -rfv deploy-bundle/node_modules/@next/swc-linux-x64-musl
          echo "--- after removal ---"
          ls -la deploy-bundle/node_modules/@next/ || echo "no @next dir"
          find deploy-bundle -size +90M -exec ls -lh {} \;

      - name: Publish to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp -r deploy-bundle/. .
          rm -rf deploy-bundle
          git add -A
          git commit -m "Deploy bundle from ${{ github.sha }}"
          git branch -D deploy 2>/dev/null || true
          git branch -m deploy
          git push origin deploy --force
